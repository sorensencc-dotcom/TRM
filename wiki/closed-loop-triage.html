<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Regenerated: CIC readable parchment (#F5F0E6 field, #FAF6F0 nodes, forge ink borders/text, brass/ember accents). No gradients, shadows, or rounded corners. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRM · Closed-Loop Gap Triage & RFC Synthesis</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@400;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-bg:       #F5F0E6;
      --color-paper:    #F5F0E6;
      --color-node:     #FAF6F0;
      --color-grid:     #2C2420;
      --color-stroke:   #1A1410;
      --color-brass:    #B8922A;
      --color-ember:    #C4501A;
      --color-text:     #1A1410;
      --color-ink:      #1A1410;
      --color-muted:    #5C5349;
      --font-sans:      'Barlow Condensed', system-ui, sans-serif;
      --font-serif:     'Playfair Display', serif;
      --font-sub:       'Libre Baskerville', serif;
    }
    body { font-family: var(--font-sans); background: var(--color-bg); color: var(--color-text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-sub); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-text); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">TRM Closed-Loop Triage · Cathryn Lavery Diagram Design</p>
    <h1>TRM: research gap discovery to RFC synthesis</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5C5349"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C4501A"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#F5F0E6"/>

      <rect x="60" y="128" width="260" height="544" fill="rgba(26,20,16,0.08)" stroke="rgba(26,20,16,0.1)" stroke-width="0.8"/>
      <text x="190" y="141" fill="rgba(26,20,16,0.35)" font-size="7" font-family="'Libre Baskerville', monospace" text-anchor="middle" letter-spacing="0.14em">1. GAP DISCOVERY</text>

      <rect x="360" y="128" width="280" height="544" fill="rgba(26,20,16,0.08)" stroke="rgba(26,20,16,0.1)" stroke-width="0.8"/>
      <text x="500" y="141" fill="rgba(26,20,16,0.35)" font-size="7" font-family="'Libre Baskerville', monospace" text-anchor="middle" letter-spacing="0.14em">2. CONTEXT CACHE SEARCH</text>

      <rect x="680" y="128" width="260" height="544" fill="rgba(26,20,16,0.08)" stroke="rgba(26,20,16,0.1)" stroke-width="0.8"/>
      <text x="810" y="141" fill="rgba(26,20,16,0.35)" font-size="7" font-family="'Libre Baskerville', monospace" text-anchor="middle" letter-spacing="0.14em">3. TRIAGE EVALUATION</text>

      <rect x="980" y="128" width="240" height="544" fill="rgba(26,20,16,0.08)" stroke="rgba(26,20,16,0.1)" stroke-width="0.8"/>
      <text x="1100" y="141" fill="rgba(26,20,16,0.35)" font-size="7" font-family="'Libre Baskerville', monospace" text-anchor="middle" letter-spacing="0.14em">4. RFC SYNTHESIS</text>

      <!-- Nodes -->
      <rect x="80" y="240" width="220" height="64" fill="#FAF6F0" stroke="#1A1410" stroke-width="1"/>
      <text x="96" y="257" fill="#1A1410" font-size="7" font-family="'Libre Baskerville', monospace">GAP</text>
      <text x="190" y="276" fill="#1A1410" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">trm-research-gaps.md</text>

      <rect x="380" y="240" width="240" height="64" fill="rgba(196,80,26,0.08)" stroke="#C4501A" stroke-width="1"/>
      <text x="396" y="257" fill="#C4501A" font-size="7" font-family="'Libre Baskerville', monospace">FTS</text>
      <text x="500" y="276" fill="#1A1410" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">kb-sync SQLite FTS5</text>
      <text x="500" y="292" fill="#5C5349" font-size="9" font-family="'Libre Baskerville', monospace" text-anchor="middle">query_context_cache / BM25</text>

      <rect x="700" y="240" width="220" height="64" fill="#FAF6F0" stroke="#1A1410" stroke-width="1"/>
      <text x="716" y="257" fill="#1A1410" font-size="7" font-family="'Libre Baskerville', monospace">EVL</text>
      <text x="810" y="276" fill="#1A1410" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">Triage Resolution Evaluator</text>

      <rect x="1000" y="200" width="200" height="64" fill="rgba(196,80,26,0.08)" stroke="#C4501A" stroke-width="1"/>
      <text x="1016" y="217" fill="#C4501A" font-size="7" font-family="'Libre Baskerville', monospace">RFC</text>
      <text x="1100" y="236" fill="#1A1410" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">RFC Decision Note</text>
      <text x="1100" y="252" fill="#5C5349" font-size="9" font-family="'Libre Baskerville', monospace" text-anchor="middle">wiki/research/RFC-*.md</text>

      <rect x="1000" y="320" width="200" height="64" fill="rgba(184,146,42,0.08)" stroke="#B8922A" stroke-width="1"/>
      <text x="1016" y="337" fill="#B8922A" font-size="7" font-family="'Libre Baskerville', monospace">OK</text>
      <text x="1100" y="356" fill="#1A1410" font-size="12" font-weight="600" font-family="'Barlow Condensed', sans-serif" text-anchor="middle">Mark RESOLVED</text>

      <!-- Connectors -->
      <line x1="300" y1="272" x2="380" y2="272" stroke="#5C5349" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="272" x2="700" y2="272" stroke="#C4501A" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="920" y1="272" x2="1000" y2="232" stroke="#C4501A" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="920" y1="272" x2="1000" y2="352" stroke="#5C5349" stroke-width="1.2" marker-end="url(#arrow)"/>
    </svg>
  </div>
</body>
</html>
